
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closetly - Outfit Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h2>Closetly 🎀</h2>
    <nav>
        <a href="#home">Home</a>
        <a href="#wardrobe">Wardrobe</a>
        <a href="#outfits">Create Outfit</a>
        <a href="#calendar">Calendar</a>
    </nav>
</header>

<section class="hero" id="home">
    <h1>Your Style, Your Story ✨</h1>
    <p>Organize your wardrobe and create beautiful outfits.</p>
    <button onclick="goToWardrobe()">Explore My Closet</button>
</section>

<section id="wardrobe">
    <h2>My Wardrobe 👗</h2>
    <p>Upload your favourite clothes</p>

    <input type="file" id="clothesImage" accept="image/*">
    <select id="category">
        <option value="Tops">Tops</option>
        <option value="Bottoms">Bottoms</option>
        <option value="Dresses">Dresses</option>
        <option value="Shoes">Shoes</option>
        <option value="Bags">Bags</option>
        <option value="Accessories">Accessories</option>
    </select>

    <button onclick="addClothes()">Add Clothes</button>
    <div id="wardrobeItems" class="categories"></div>
</section>

<section id="outfits">
    <h2>Create Your Outfit 💗</h2>

    <select id="topSelect">
        <option value="">Choose Top</option>
    </select>

    <select id="bottomSelect">
        <option value="">Choose Bottom</option>
    </select>

    <select id="shoeSelect">
        <option value="">Choose Shoes</option>
    </select>

    <button onclick="createOutfit()">Create Outfit</button>
    <button onclick="saveOutfit()">Save Favourite</button>

    <div id="outfitResult"></div>
</section>

<section id="favourites">
    <h2>My Favourite Outfits ❤️</h2>
    <div id="favouriteItems"></div>
</section>

<section id="calendar">
    <h2>Plan Your Looks 📅</h2>
    <input type="date" id="outfitDate">
    <button onclick="planOutfit()">Plan My Outfit</button>
    <div id="plannedItems"></div>
</section>

<footer>
    <p>© 2026 Closetly | Made with love 💗</p>
</footer>

<script src="script.js"></script>
</body>
</html>
